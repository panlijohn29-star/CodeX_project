<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ url_for('truck_rate_asset', asset_path='favicon.svg') }}" type="image/svg+xml">
  <title>{{ feature.title }} | Report Platform</title>
  <style>
    @font-face{font-family:"Overpass";src:url("{{ url_for('truck_rate_asset', asset_path='fonts/overpass-latin-wght-normal.woff2') }}") format("woff2");font-weight:100 900;font-display:swap}
    @font-face{font-family:"Overpass";src:local("Segoe UI"),local("Arial"),local("Helvetica");font-weight:100 900;unicode-range:U+00B7}
    :root{--asphalt:#15191b;--asphalt-2:#2b3135;--on:#f3f5f4;--on-2:#b9c1bd;--ink:#14181b;--ink-2:#3f474c;--ink-3:#59625f;--line:#d4d8d5;--line-strong:#aeb4b0;--ground:#edefed;--sign:#006747;--warn:#f5c400;--stop:#b4232f;--apex:#7a1c22}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);font:14px/1.45 "Overpass","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    ::selection{background:var(--warn);color:var(--ink)}
    :focus-visible{outline:2px solid var(--warn);outline-offset:2px}
    .platform-bar{display:flex;align-items:center;justify-content:space-between;gap:6px 20px;flex-wrap:wrap;min-height:44px;padding:4px 28px 2px;color:var(--on-2);background:var(--asphalt);border-top:3px solid var(--apex);border-bottom:1px solid #000}
    .platform-path{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0;font-size:13px;font-weight:600}
    .company{color:var(--on);font-weight:800;letter-spacing:.02em}
    .sep{width:1px;height:16px;background:#4a5257}
    .platform-bar a{color:var(--on);text-decoration:none;text-underline-offset:3px}
    .platform-bar a:hover{text-decoration:underline}
    .meta{display:flex;align-items:center;gap:14px;font-size:13px}
    .saved-note{color:var(--on-2)}
    .log-button{height:30px;padding:2px 12px 0;border:1px solid #5d666b;border-radius:6px;background:transparent;color:var(--on);font:inherit;font-weight:700;cursor:pointer}
    .log-button:hover{border-color:#8a9399;background:var(--asphalt-2)}
    .frame{display:block;flex:1;width:100%;min-height:680px;border:0;background:var(--ground)}
    .log-dialog{width:min(840px,calc(100vw - 32px));max-height:min(85vh,900px);padding:0;border:0;border-radius:12px;color:var(--ink);font-family:inherit;box-shadow:0 24px 60px #14181b59}
    .log-dialog::backdrop{background:#14181b8c}
    .log-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:16px 22px 14px}
    .log-header h2{margin:0;font-size:21px;font-weight:800}
    .log-close{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:6px;background:none;color:var(--ink-2);cursor:pointer}
    .log-close:hover{background:#dfe2df;color:var(--ink)}
    .log-close svg{width:18px;height:18px}
    .log-body{max-height:calc(85vh - 132px);overflow:auto;padding:6px 22px 12px}
    .log-entry{border-bottom:1px solid var(--line);padding:14px 0}
    .log-entry:last-child{border-bottom:0}
    .log-entry-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px}
    .log-entry-title{font-weight:800}
    .log-entry-time{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
    .log-change{margin:10px 0 0;padding:9px 12px 7px;background:#f6f7f6;border:1px solid var(--line);border-radius:8px}
    .log-change-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700}
    .plaque{display:inline-flex;padding:2px;border-radius:5px}
    .plaque>span{display:block;padding:3px 7px 1px;border:1.5px solid currentColor;border-radius:3px;font-size:11px;font-weight:800;line-height:1.25;letter-spacing:.05em;text-transform:uppercase}
    .plaque.added{color:#fff;background:var(--sign)}
    .plaque.updated{color:var(--ink);background:var(--warn)}
    .plaque.deleted{color:#fff;background:var(--stop)}
    .log-values{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere;margin-top:4px;font-variant-numeric:tabular-nums}
    .log-empty{color:var(--ink-3);padding:28px 0;text-align:center}
    .pager{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 22px;color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
    .pager-controls{display:flex;gap:8px}
    .pager button{height:34px;padding:2px 14px 0;border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
    .pager button:hover:not(:disabled){border-color:var(--ink-2);background:#f6f7f6}
    .pager button:disabled{opacity:.45;cursor:default}
    .log-dialog :focus-visible{outline-color:var(--ink)}
    @media(max-width:680px){.platform-bar{padding:6px 16px}.meta{flex-wrap:wrap;gap:8px 12px}.log-body{padding:6px 16px 10px}.log-header,.pager{padding:12px 16px}}
  </style>
</head>
<body>
<header class="platform-bar">
  <nav class="platform-path" aria-label="Breadcrumb"><span class="company">Apex Logistics</span><span class="sep" aria-hidden="true"></span><a href="/">Report Platform</a><span aria-hidden="true">/</span><span>{{ feature.category }}</span><span aria-hidden="true">/</span><span>{{ feature.title }}</span></nav>
  <div class="meta">
    <span class="saved-note">Changes save to shared server storage</span>
    {% if can_view_truck_rate_log %}<button class="log-button" id="open-log" type="button">Operation Log</button>{% endif %}
    <span>Signed in as {{ user_id }} · <a href="/logout">Log out</a></span>
  </div>
</header>
<iframe class="frame" title="Truck Rate Manager" src="{{ url_for('truck_rate_app') }}"></iframe>
{% if can_view_truck_rate_log %}
<dialog class="log-dialog" id="log-dialog" aria-labelledby="log-title">
  <div class="log-header"><h2 id="log-title">Truck Rate Operation Log</h2><button class="log-close" id="close-log" type="button" aria-label="Close log"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="log-body" id="log-body" aria-live="polite"></div>
  <div class="pager">
    <span id="log-page-label"></span>
    <div class="pager-controls"><button id="log-prev" type="button">Previous</button><button id="log-next" type="button">Next</button></div>
  </div>
</dialog>
<script>
(() => {
  const dialog = document.getElementById('log-dialog');
  const body = document.getElementById('log-body');
  const label = document.getElementById('log-page-label');
  const previous = document.getElementById('log-prev');
  const next = document.getElementById('log-next');
  const fieldNames = {name:'Name',group:'Group',ftlRate:'Per FTL rate',perKiloRate:'Per kilo rate',street:'Street address',city:'City',state:'State',zip:'ZIP',zoneSet:'Zone set',effectiveFrom:'Effective from',effectiveTo:'Effective to'};
  const entityLabels = {origin:'pickup',zoneSet:'zone set',area:'area',location:'location',rate:'rate'};
  let page = 1;
  let total = 0;
  const pageSize = 20;

  function valueText(value, field) {
    if ((value === null || value === undefined || value === '') && (field === 'effectiveFrom' || field === 'effectiveTo')) return 'no limit';
    if (value === null || value === undefined || value === '') return '—';
    return String(value);
  }

  function addText(parent, className, content) {
    const element = document.createElement('div');
    element.className = className;
    element.textContent = content;
    parent.appendChild(element);
    return element;
  }

  function renderChange(parent, change) {
    const row = document.createElement('div');
    row.className = 'log-change';
    const action = {added:'Added',updated:'Updated',deleted:'Deleted'}[change.action] || change.action;
    const entity = entityLabels[change.entity] || 'area';
    const subject = change.entity === 'origin' ? (change.origin || 'Unnamed pickup')
      : change.entity === 'zoneSet' ? (change.zoneSet || 'Unnamed zone set')
      : change.entity === 'rate' ? `${change.origin || 'Unnamed pickup'} · ${change.area || 'Unnamed area'}`
      : (change.area || 'Unnamed area');
    const scope = ['area', 'location'].includes(change.entity) && change.zoneSet ? ` (${change.zoneSet})` : '';
    const title = document.createElement('div');
    title.className = 'log-change-title';
    const plaque = document.createElement('span');
    plaque.className = `plaque ${change.action}`;
    const plaqueText = document.createElement('span');
    plaqueText.textContent = action;
    plaque.appendChild(plaqueText);
    const text = document.createElement('span');
    text.textContent = `${entity} · ${subject}${scope}`;
    title.append(plaque, text);
    row.appendChild(title);
    const before = change.before || {};
    const after = change.after || {};
    for (const field of new Set([...Object.keys(before), ...Object.keys(after)])) {
      const name = fieldNames[field] || field;
      const detail = change.action === 'updated'
        ? `${name}: ${valueText(before[field], field)} → ${valueText(after[field], field)}`
        : `${name}: ${valueText((change.action === 'deleted' ? before : after)[field], field)}`;
      addText(row, 'log-values', detail);
    }
    parent.appendChild(row);
  }

  async function loadPage(targetPage) {
    body.replaceChildren();
    addText(body, 'log-empty', 'Loading log…');
    previous.disabled = true;
    next.disabled = true;
    try {
      const response = await fetch(`/api/truck-rate/log?page=${targetPage}`, {credentials:'same-origin'});
      if (!response.ok) throw new Error('The operation log could not be loaded. Close and reopen it to try again.');
      const result = await response.json();
      page = result.page;
      total = result.total;
      body.replaceChildren();
      if (!result.entries.length) addText(body, 'log-empty', 'No recorded changes yet.');
      for (const entry of result.entries) {
        const article = document.createElement('article');
        article.className = 'log-entry';
        const head = document.createElement('div');
        head.className = 'log-entry-head';
        addText(head, 'log-entry-title', `Revision ${entry.revision} · ${entry.user_id}`);
        addText(head, 'log-entry-time', new Date(entry.timestamp).toLocaleString());
        article.appendChild(head);
        for (const change of entry.changes) renderChange(article, change);
        body.appendChild(article);
      }
      label.textContent = total ? `Page ${page} of ${Math.ceil(total / pageSize)} · ${total} ${total === 1 ? 'save' : 'saves'}` : 'No saves';
      previous.disabled = page <= 1;
      next.disabled = page * pageSize >= total;
    } catch (error) {
      body.replaceChildren();
      addText(body, 'log-empty', error.message);
      label.textContent = '';
    }
  }

  document.getElementById('open-log').addEventListener('click', () => { dialog.showModal(); loadPage(1); });
  document.getElementById('close-log').addEventListener('click', () => dialog.close());
  previous.addEventListener('click', () => loadPage(page - 1));
  next.addEventListener('click', () => loadPage(page + 1));
})();
</script>
{% endif %}
</body>
</html>
