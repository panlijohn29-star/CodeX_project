<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Platform Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #fff0c7 0, transparent 30%),
        linear-gradient(135deg, #ebe5dc, #dbe9ed);
      font-family: Georgia, "Times New Roman", serif;
      color: #20303d;
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      background: rgba(255, 250, 243, 0.95);
      border: 1px solid #d8c9b5;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(25, 44, 56, 0.12);
    }
    h1 { margin: 0 0 8px; font-size: 34px; }
    p { margin: 0 0 18px; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c8b8a4;
      border-radius: 12px;
      font-size: 15px;
      background: #fffdf9;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 16px;
      border: 0;
      border-radius: 999px;
      background: #125976;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    .error { margin-top: 12px; color: #a12727; font-size: 14px; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>Sign In</h1>
    <p>Use the assigned account to access the report platform.</p>
    <label for="user_id">ID</label>
    <input id="user_id" name="user_id" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log In</button>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </form>
</body>
</html>
