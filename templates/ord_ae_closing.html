<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ feature.title }} | Report Platform</title>
  <style>
    :root{--navy:#153d5b;--blue:#1e6b9a;--bg:#f3f6f8;--line:#d9e2e9;--muted:#697888;--danger:#a43d3d;--good:#16735c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#162330;font:14px/1.45 "Segoe UI",Arial,sans-serif}.shell{max-width:1400px;margin:auto;padding:24px}.top,.actions,.result-top,.cards{display:flex;align-items:center;gap:14px}.top,.result-top{justify-content:space-between}.crumb,.meta{color:var(--muted);font-size:13px}a{color:var(--blue);text-decoration:none}h1{margin:4px 0;font-size:27px}.subtitle{color:var(--muted)}.panel,.result{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 18px #18364b0c}.panel{margin-top:22px;padding:20px}.filters{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:15px}.field{display:grid;gap:6px;font-weight:600;color:#294052}.field.wide{grid-column:span 2}input,select,button{font:inherit;border-radius:7px}input,select{width:100%;padding:9px 10px;border:1px solid #cbd8e1;background:#fff}button{border:0;padding:10px 14px;background:var(--blue);color:#fff;cursor:pointer;font-weight:700}button.secondary{background:#fff;color:#365166;border:1px solid #c8d7e1}button:disabled{opacity:.55;cursor:not-allowed}.actions{margin-top:18px}.status{color:var(--muted);font-weight:600}.result{margin-top:22px;padding:18px}.hidden{display:none}.cards{flex-wrap:wrap;margin:12px 0}.card{min-width:150px;padding:10px 13px;border-radius:8px;background:#eef5f8}.card.bad{background:#fff0f0;color:var(--danger)}.card.good{background:#ebf8f3;color:var(--good)}.card strong{display:block;font-size:20px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0}.tab{background:transparent;color:var(--muted);border-radius:7px 7px 0 0}.tab.active{background:#eaf4fb;color:var(--navy)}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1180px}th,td{padding:9px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid #e4ebef}th{font-size:11px;color:var(--muted);text-transform:uppercase}.sort{padding:0;background:transparent;color:inherit;font-size:inherit}.pagination{padding-top:12px;justify-content:flex-end}.notice{margin:10px 0;padding:10px;border-radius:7px;background:#fff0f0;color:var(--danger);white-space:pre-wrap}pre{margin:0;overflow:auto;padding:14px;background:#f8fafb;border:1px solid var(--line);border-radius:8px;font:12px/1.5 Consolas,monospace}@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.field.wide{grid-column:span 1}.top{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.shell{padding:15px}.filters{grid-template-columns:1fr}.actions{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><div class="crumb"><a href="/">Report Platform</a> / {{ feature.category }}</div><h1>{{ feature.title }}</h1><div class="subtitle">ORD Air Export closing status, invoices, and GP in one report.</div></div><div class="meta">Signed in as {{ user_id }} · <a href="/logout">Log out</a></div></header>
  <section class="panel"><div class="filters">
    <label class="field">Database<select id="dbProfile">{% for profile in db_profiles %}<option value="{{ profile }}">{{ profile }}</option>{% endfor %}</select></label>
    <label class="field">Closing Status<select id="closingStatus"><option value="">All</option><option value="CLOSED">CLOSED</option><option value="UNCLOSED">UNCLOSED</option></select></label>
    <label class="field">ETD From *<input id="etdFrom" type="date" required></label>
    <label class="field">ETD To<input id="etdTo" type="date"></label>
    <label class="field">Job No<input id="jobNo" placeholder="Contains"></label>
    <label class="field">Customer Match<select id="customerMode"><option value="starts_with">Starts with</option><option value="contains">Contains</option></select></label>
    <label class="field wide">Customer<input id="customer" placeholder="Customer"></label>
    <label class="field">MBL No<input id="mblNo" placeholder="Contains"></label>
    <label class="field">HBL No<input id="hblNo" placeholder="Contains"></label>
  </div><div class="actions"><button id="run">Run Report</button><button id="preview" class="secondary">Preview SQL</button><button id="clear" class="secondary">Clear</button><span id="status" class="status">ETD From is required.</span></div></section>
  <section id="results" class="result hidden"><div class="result-top"><strong id="resultTitle">Results</strong><div class="actions"><button id="original" class="secondary" disabled>Download original file</button><button id="batch" class="secondary" disabled>Download batch closing rpt</button></div></div><div id="cards" class="cards"></div><div class="tabs"><button class="tab active" data-tab="table">Report Output</button><button class="tab" data-tab="sql">Generated SQL</button></div><div id="tableView"><div class="scroll"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><div id="pagination" class="actions pagination hidden"><button id="previous" class="secondary">Previous</button><span id="pageStatus" class="meta"></span><button id="next" class="secondary">Next</button></div></div><div id="sqlView" class="hidden"><pre id="sql"></pre></div></section>
</main><script>
const $=id=>document.getElementById(id),PAGE_SIZE=1000;let rows=[],columns=[],labels={},query='',sort={column:'',direction:'asc'},page=1;
function payload(){return{db_profile:$('dbProfile').value,closing_status:$('closingStatus').value,etd_from:$('etdFrom').value,etd_to:$('etdTo').value,job_no:$('jobNo').value,customer:$('customer').value,customer_mode:$('customerMode').value,mbl_no:$('mblNo').value,hbl_no:$('hblNo').value}}
function setStatus(text,error=false){$('status').textContent=text;$('status').style.color=error?'var(--danger)':'var(--muted)'}function busy(value){['run','preview','clear'].forEach(id=>$(id).disabled=value)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ordered(){if(!sort.column)return rows;let d=sort.direction==='asc'?1:-1;return [...rows].sort((a,b)=>String(a[sort.column]??'').localeCompare(String(b[sort.column]??''),undefined,{numeric:true})*d)}
function showCards(s){$('cards').innerHTML=`<div class="card"><span>Total jobs</span><strong>${s.total.toLocaleString()}</strong></div><div class="card bad"><span>Unclosed</span><strong>${s.unclosed.toLocaleString()}</strong></div><div class="card good"><span>Closed</span><strong>${s.closed.toLocaleString()}</strong></div><div class="card"><span>Total GP</span><strong>${Number(s.total_gp).toLocaleString(undefined,{maximumFractionDigits:0})}</strong></div><div class="card bad"><span>Unclosed GP</span><strong>${Number(s.unclosed_gp).toLocaleString(undefined,{maximumFractionDigits:0})}</strong></div><div class="card good"><span>Closed GP</span><strong>${Number(s.closed_gp).toLocaleString(undefined,{maximumFractionDigits:0})}</strong></div>`}
function render(){let all=ordered(),pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));page=Math.min(page,pages);let visible=all.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);$('head').innerHTML=columns.map(c=>`<th><button class="sort" data-col="${esc(c)}">${esc(labels[c]||c)} ${sort.column===c?(sort.direction==='asc'?'↑':'↓'):''}</button></th>`).join('');$('body').innerHTML=visible.length?visible.map(row=>`<tr>${columns.map(c=>`<td>${esc(row[c])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${columns.length||1}" class="meta">No records found.</td></tr>`;$('pagination').classList.toggle('hidden',all.length<=PAGE_SIZE);$('pageStatus').textContent=`Page ${page} of ${pages} · showing ${visible.length.toLocaleString()} of ${all.length.toLocaleString()} rows`;$('previous').disabled=page===1;$('next').disabled=page===pages;$('head').querySelectorAll('.sort').forEach(b=>b.onclick=()=>{let c=b.dataset.col;sort=sort.column===c?{column:c,direction:sort.direction==='asc'?'desc':'asc'}:{column:c,direction:'asc'};page=1;render()})}
async function post(path,data=payload()){let response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let body=await response.json();if(!response.ok)throw Error(body.error||'Request failed');return body}function tab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('tableView').classList.toggle('hidden',name!=='table');$('sqlView').classList.toggle('hidden',name!=='sql')}
async function run(kind){if(!$('etdFrom').value){setStatus('Please fill in ETD From before running the report.',true);$('etdFrom').focus();return}busy(true);setStatus(kind==='search'?'Running report…':'Building SQL preview…');try{let p=await post('/api/ord-ae-closing/'+kind);$('results').classList.remove('hidden');query=p.query_sql||'';$('sql').textContent=query;if(kind==='search'){rows=p.rows||[];columns=p.columns||[];labels=p.column_labels||{};sort={column:'',direction:'asc'};page=1;showCards(p.summary);render();$('resultTitle').textContent=`${p.db_profile} · ${p.row_count.toLocaleString()} row(s)`;$('original').disabled=!rows.length;$('batch').disabled=!rows.length;tab('table');setStatus('Report completed')}else{tab('sql');setStatus('SQL preview ready')}}catch(e){setStatus(e.message,true)}finally{busy(false)}}
$('run').onclick=()=>run('search');$('preview').onclick=()=>run('preview');$('clear').onclick=()=>{document.querySelectorAll('input').forEach(i=>i.value='');$('closingStatus').value='';$('customerMode').value='starts_with';rows=[];columns=[];$('results').classList.add('hidden');setStatus('ETD From is required.')};$('previous').onclick=()=>{if(page>1){page--;render()}};$('next').onclick=()=>{if(page<Math.ceil(ordered().length/PAGE_SIZE)){page++;render()}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
async function download(type){try{setStatus('Preparing download…');let data=payload();if(type==='batch_closing')data.request_date=new Date().toLocaleDateString('en-CA');let response=await fetch('/api/ord-ae-closing/export/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!response.ok){let p=await response.json();throw Error(p.error||'Download failed')}let blob=await response.blob(),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='';document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(link.href);setStatus('Download ready')}catch(e){setStatus(e.message,true)}}$('original').onclick=()=>download('original');$('batch').onclick=()=>download('batch_closing');
</script></body></html>
