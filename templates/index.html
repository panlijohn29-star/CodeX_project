<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Closing Report App</title>
  <style>
    :root {
      --bg: #f4efe8;
      --card: #fffaf3;
      --ink: #1d2a36;
      --accent: #145a7a;
      --accent-soft: #d9edf5;
      --line: #d7c7b5;
      --ok: #2e6b3a;
      --warn: #9a5f00;
      --bad: #a12727;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, #fff6dd 0, transparent 32%),
        linear-gradient(135deg, #f4efe8, #e8f0f2);
      color: var(--ink);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .hero {
      padding: 28px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(29, 42, 54, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 38px;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0;
      max-width: 720px;
      line-height: 1.6;
    }
    .actions {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      font-size: 14px;
      color: #4a5966;
    }
    .progress-card, .runs-card {
      margin-top: 22px;
      padding: 22px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 18px;
    }
    .bar {
      width: 100%;
      height: 16px;
      border-radius: 999px;
      background: #e5ddd2;
      overflow: hidden;
      margin: 12px 0 8px;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1c7fa2, #57b7c7);
      transition: width 0.3s ease;
    }
    .runs {
      display: grid;
      gap: 14px;
    }
    .run {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #fff;
    }
    .run-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .pill.completed { background: #dff3e2; color: var(--ok); }
    .pill.running, .pill.queued { background: #fff0d6; color: var(--warn); }
    .pill.failed { background: #f9dada; color: var(--bad); }
    .meta, .error {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    a.download {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }
    @media (max-width: 640px) {
      h1 { font-size: 30px; }
      .hero, .progress-card, .runs-card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>Closing Report Web App</h1>
      <p class="sub">Open this page in a browser, start a report run, and download the finished zip file when it completes. The app keeps each run in its own folder so different users do not overwrite each other.</p>
      <div class="actions">
        <button id="startBtn">Run New Report</button>
        <span class="status" id="runState">Ready</span>
      </div>
    </section>

    <section class="progress-card">
      <strong>Current Run</strong>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
      <div id="progressText">No run started yet.</div>
    </section>

    <section class="runs-card">
      <strong>Recent Runs</strong>
      <div class="runs" id="runs"></div>
    </section>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const runState = document.getElementById("runState");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const runsEl = document.getElementById("runs");
    let activeRunId = null;
    let pollTimer = null;

    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderRuns(runs) {
      if (!runs.length) {
        runsEl.innerHTML = "<div class='run'>No reports yet.</div>";
        return;
      }

      runsEl.innerHTML = runs.map((run) => {
        const total = run.total_tasks || 1;
        const percent = Math.round((run.completed_tasks || 0) / total * 100);
        const download = run.status === "completed" ? `<a class="download" href="/download/${run.run_id}">Download zip</a>` : "";
        const error = run.error ? `<div class="error">Error: ${escapeHtml(run.error)}</div>` : "";
        return `
          <div class="run">
            <div class="run-top">
              <div>
                <div><strong>Run ${escapeHtml(run.run_id)}</strong></div>
                <div class="meta">Created: ${escapeHtml(run.created_at)}</div>
              </div>
              <span class="pill ${escapeHtml(run.status)}">${escapeHtml(run.status)}</span>
            </div>
            <div class="meta">${escapeHtml(run.message || "")}</div>
            <div class="meta">Progress: ${run.completed_tasks || 0}/${total} (${percent}%)</div>
            <div class="meta">${download}</div>
            ${error}
          </div>
        `;
      }).join("");
    }

    async function loadRuns() {
      const response = await fetch("/api/runs");
      const runs = await response.json();
      renderRuns(runs);
    }

    async function pollStatus() {
      if (!activeRunId) return;
      const response = await fetch(`/api/status/${activeRunId}`);
      if (!response.ok) return;
      const run = await response.json();
      const total = run.total_tasks || 1;
      const percent = Math.round((run.completed_tasks || 0) / total * 100);
      progressFill.style.width = `${percent}%`;
      progressText.textContent = `${run.message} (${run.completed_tasks}/${total})`;
      runState.textContent = `Run ${run.run_id}: ${run.status}`;
      await loadRuns();

      if (run.status === "completed" || run.status === "failed") {
        startBtn.disabled = false;
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      runState.textContent = "Starting new run...";
      progressFill.style.width = "0%";
      progressText.textContent = "Preparing report run...";
      const response = await fetch("/api/run", { method: "POST" });
      const payload = await response.json();
      activeRunId = payload.run_id;
      await loadRuns();
      await pollStatus();
      pollTimer = setInterval(pollStatus, 3000);
    });

    loadRuns();
  </script>
</body>
</html>
