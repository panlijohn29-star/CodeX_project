<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ feature.title }} | Report Platform</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #17202a;
      --muted: #607080;
      --line: #d8dee6;
      --accent: #145a7a;
      --ok: #2e6b3a;
      --warn: #9a5f00;
      --bad: #a12727;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--ink); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 24px 20px 44px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    h2 { margin: 0 0 14px; font-size: 18px; }
    .muted, .meta, .status, .error { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .error { color: var(--bad); }
    .layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; margin-top: 22px; }
    .section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    .group {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fbfcfd;
      margin-top: 12px;
    }
    .office-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px 14px;
      margin-top: 10px;
    }
    label.office { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
    button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    button.secondary { background: #607080; }
    button.cancel { background: #a85b16; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .bar { width: 100%; height: 14px; border-radius: 999px; background: #e6ebf0; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.25s ease; }
    .runs { display: grid; gap: 10px; margin-top: 12px; }
    .run {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: uppercase;
      background: #d9edf5;
      color: var(--accent);
    }
    .pill.completed { background: #dff3e2; color: var(--ok); }
    .pill.running, .pill.queued, .pill.cancelling { background: #fff0d6; color: var(--warn); }
    .pill.failed, .pill.cancelled { background: #f9dada; color: var(--bad); }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="meta"><a href="/">Report Platform</a> / {{ feature.category }}</div>
        <h1>{{ feature.title }}</h1>
        <div class="muted">{{ feature.description }}</div>
      </div>
      <div class="muted">Signed in as {{ user_id }} | <a href="/logout">Log out</a></div>
    </header>

    <div class="layout">
      <section class="section">
        <h2>Inputs</h2>
        <div id="inputRoot"></div>
        <div class="actions">
          <button type="button" class="secondary" id="selectAllBtn">Select All</button>
          <button type="button" class="secondary" id="clearAllBtn">Clear All</button>
          <span class="status" id="selectionState"></span>
        </div>
        <div class="actions">
          <button id="startBtn">Run</button>
          <button id="cancelBtn" class="cancel" disabled>Cancel Current Run</button>
          <span class="status" id="runState">Ready</span>
        </div>
      </section>

      <section class="section">
        <h2>Current Run</h2>
        <div class="bar"><div class="fill" id="progressFill"></div></div>
        <div id="progressText" class="status">No run started yet.</div>
      </section>
    </div>

    <section class="section" style="margin-top:20px">
      <h2>Recent Runs</h2>
      <div class="runs" id="runs"></div>
    </section>
  </main>

  <script>
    const feature = {{ feature|tojson }};
    const inputRoot = document.getElementById("inputRoot");
    const startBtn = document.getElementById("startBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const selectAllBtn = document.getElementById("selectAllBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const selectionState = document.getElementById("selectionState");
    const runState = document.getElementById("runState");
    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");
    const runsEl = document.getElementById("runs");
    let activeRunId = null;
    let pollTimer = null;

    function escapeHtml(text) {
      return String(text ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function officeInputs() {
      return Array.from(document.querySelectorAll('input[data-field-type="office_groups"]'));
    }

    function renderInputs() {
      inputRoot.innerHTML = feature.input_schema.map((field) => {
        if (field.type === "office_groups") {
          return `
            <div>
              <strong>${escapeHtml(field.label)}</strong>
              ${field.groups.map((group) => `
                <div class="group">
                  <strong>${escapeHtml(group.label)}</strong>
                  <div class="office-list">
                    ${group.offices.map((office) => `
                      <label class="office">
                        <input type="checkbox" data-field-name="${escapeHtml(field.name)}" data-field-type="office_groups" value="${escapeHtml(office)}" checked>
                        <span>${escapeHtml(office)}</span>
                      </label>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          `;
        }
        return `<div class="error">Unsupported input type: ${escapeHtml(field.type)}</div>`;
      }).join("");

      officeInputs().forEach((input) => input.addEventListener("change", updateSelectionState));
      updateSelectionState();
    }

    function updateSelectionState() {
      const selected = officeInputs().filter((input) => input.checked).length;
      const total = officeInputs().length;
      selectionState.textContent = total ? `${selected} of ${total} offices selected` : "";
    }

    function setAllSelections(checked) {
      officeInputs().forEach((input) => {
        input.checked = checked;
      });
      updateSelectionState();
    }

    function collectInputs() {
      const inputs = {};
      feature.input_schema.forEach((field) => {
        if (field.type === "office_groups") {
          inputs[field.name] = officeInputs().filter((input) => input.checked).map((input) => input.value);
        }
      });
      return inputs;
    }

    function downloadMarkup(run) {
      if (run.status !== "completed") return "";
      if (run.outputs && run.outputs.length) {
        return run.outputs.map((output) => `<a href="${escapeHtml(output.download_url)}">${escapeHtml(output.name)}</a>`).join(", ");
      }
      return run.zip_name ? `<a href="/download/${escapeHtml(run.run_id)}">${escapeHtml(run.zip_name)}</a>` : "";
    }

    function renderRuns(runs) {
      const featureRuns = runs.filter((run) => run.feature_id === feature.id);
      if (!featureRuns.length) {
        runsEl.innerHTML = "<div class='run muted'>No runs yet.</div>";
        return;
      }
      runsEl.innerHTML = featureRuns.slice(0, 12).map((run) => {
        const total = run.total_tasks || 1;
        const percent = Math.round((run.completed_tasks || 0) / total * 100);
        const download = downloadMarkup(run);
        const error = run.error ? `<div class="error">Error: ${escapeHtml(run.error)}</div>` : "";
        return `
          <div class="run">
            <div class="row">
              <div>
                <strong>${escapeHtml(run.run_id)}</strong>
                <div class="meta">${escapeHtml(run.created_at || "")} · ${escapeHtml(run.inputs_summary || "")}</div>
              </div>
              <span class="pill ${escapeHtml(run.status)}">${escapeHtml(run.status)}</span>
            </div>
            <div class="meta">${escapeHtml(run.message || "")}</div>
            <div class="meta">Progress: ${run.completed_tasks || 0}/${total} (${percent}%)</div>
            <div class="meta">${download}</div>
            ${error}
          </div>
        `;
      }).join("");
    }

    async function loadRuns() {
      const response = await fetch("/api/runs");
      if (!response.ok) return;
      renderRuns(await response.json());
    }

    function setActiveControls(status) {
      const running = ["queued", "running", "cancelling"].includes(status);
      startBtn.disabled = running;
      cancelBtn.disabled = !feature.supports_cancel || !running || !activeRunId;
    }

    async function pollStatus() {
      if (!activeRunId) return;
      const response = await fetch(`/api/runs/${activeRunId}`);
      if (!response.ok) return;
      const run = await response.json();
      const total = run.total_tasks || 1;
      const percent = Math.round((run.completed_tasks || 0) / total * 100);
      progressFill.style.width = `${percent}%`;
      progressText.textContent = `${run.message || ""} (${run.completed_tasks || 0}/${total})`;
      runState.textContent = `Run ${run.run_id}: ${run.status}`;
      setActiveControls(run.status);
      await loadRuns();
      if (["completed", "failed", "cancelled"].includes(run.status)) {
        clearInterval(pollTimer);
        pollTimer = null;
        activeRunId = null;
        setActiveControls("completed");
      }
    }

    selectAllBtn.addEventListener("click", () => setAllSelections(true));
    clearAllBtn.addEventListener("click", () => setAllSelections(false));

    startBtn.addEventListener("click", async () => {
      const inputs = collectInputs();
      if (Array.isArray(inputs.offices) && !inputs.offices.length) {
        runState.textContent = "Select at least one office";
        return;
      }
      startBtn.disabled = true;
      runState.textContent = "Starting new run...";
      progressFill.style.width = "0%";
      progressText.textContent = "Preparing run...";
      const response = await fetch("/api/runs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ feature_id: feature.id, inputs })
      });
      const payload = await response.json();
      if (!response.ok) {
        runState.textContent = payload.error || "Unable to start run";
        setActiveControls("completed");
        return;
      }
      activeRunId = payload.run_id;
      setActiveControls("running");
      await loadRuns();
      await pollStatus();
      pollTimer = setInterval(pollStatus, 3000);
    });

    cancelBtn.addEventListener("click", async () => {
      if (!activeRunId) return;
      cancelBtn.disabled = true;
      runState.textContent = `Run ${activeRunId}: cancelling`;
      await fetch(`/api/runs/${activeRunId}/cancel`, { method: "POST" });
      await pollStatus();
    });

    renderInputs();
    loadRuns();
  </script>
</body>
</html>
