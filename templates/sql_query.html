<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Query | Report Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/codemirror/codemirror.css') }}">
  <style>
    :root{--bg:#f6f7f9;--surface:#fff;--ink:#17202a;--muted:#607080;--line:#d8dee6;--accent:#145a7a;--bad:#a12727}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}a{color:var(--accent)}.shell{max-width:1500px;margin:0 auto;padding:24px 20px}.topbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:28px}.muted,.status,.error{font-size:14px;color:var(--muted)}.error{color:var(--bad)}.layout{display:grid;grid-template-columns:minmax(250px,300px) minmax(0,1fr);gap:20px;margin-top:20px}.section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}.sidebar{position:sticky;top:16px;align-self:start;min-width:0}.sidebar h2{margin:0 0 12px;font-size:18px}.field{display:grid;gap:7px;min-width:180px}.toolbar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.query-toolbar{position:sticky;top:0;z-index:2;margin:-18px -18px 14px;padding:18px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0}.query-actions{margin-left:auto}select,input,button{font:inherit;padding:9px 11px;border-radius:6px;border:1px solid var(--line)}button{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#607080}button.danger{background:#a12727}button:disabled{opacity:.55}.library{margin-top:14px;border-top:1px solid var(--line);padding-top:8px;min-height:220px;max-height:calc(100vh - 360px);overflow-y:auto;overflow-x:hidden}.folder,.script{display:block;min-width:0;width:100%;overflow:hidden;padding:8px;text-align:left;white-space:nowrap;text-overflow:ellipsis;background:transparent;color:var(--ink);font-weight:400}.folder{font-weight:700}.script{padding-left:22px}.active{background:#e7f2f7!important;color:#0f435c!important}.small{font-size:12px;padding:7px}.table-scroll{overflow:auto;max-height:580px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted)}.hidden{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static}.library{max-height:360px}.query-actions{margin-left:0;width:100%}}
  </style>
</head>
<body><main class="shell">
<header class="topbar"><div><div class="muted"><a href="/">Report Platform</a> / Tools</div><h1>SQL Query</h1><div class="muted">Run SQL against an approved database. Write statements apply immediately.</div></div><div class="muted">Signed in as {{ user_id }} | <a href="/logout">Log out</a></div></header>
<div class="layout">
  <aside class="section sidebar"><h2>Saved SQL</h2><input id="scriptName" placeholder="Script name" style="width:100%;margin-bottom:8px"><button id="saveBtn" style="width:100%">Save to current folder</button><input id="uploadInput" type="file" accept=".sql" multiple style="width:100%;margin-top:10px"><button id="uploadBtn" class="secondary" style="width:100%;margin-top:8px">Upload .sql</button><div style="display:flex;gap:8px;margin-top:10px"><button id="newFolderBtn" class="secondary small">New folder</button><button id="deleteFolderBtn" class="danger small">Delete empty folder</button></div><button id="deleteScriptBtn" class="danger small" style="margin-top:8px">Delete selected script</button><div id="library" class="library"></div></aside>
  <div><section class="section"><div class="toolbar query-toolbar"><div class="field"><label for="dbProfile">Database</label><select id="dbProfile">{% for profile in sql_profiles %}<option value="{{ profile.id }}">{{ profile.id }} ({{ profile.database }})</option>{% endfor %}</select></div><span id="status" class="status">Ready</span><div class="actions query-actions"><button id="runBtn">Run SQL</button><button id="cancelBtn" class="danger" disabled>Terminate query</button><button id="clearBtn" class="secondary">Clear</button><button id="downloadBtn" class="secondary" disabled>Download .xlsx</button></div></div><textarea id="sqlSource"></textarea></section><section id="resultPanel" class="section hidden" style="margin-top:20px"><strong id="resultMeta"></strong><div class="table-scroll"><table><thead><tr id="resultHead"></tr></thead><tbody id="resultRows"></tbody></table></div></section></div>
</div></main>
<script src="{{ url_for('static', filename='vendor/codemirror/codemirror.js') }}"></script>
<script>
const editor=CodeMirror(document.getElementById('sqlSource'),{value:''}),db=document.getElementById('dbProfile'),status=document.getElementById('status'),library=document.getElementById('library'),nameInput=document.getElementById('scriptName'),runBtn=document.getElementById('runBtn'),cancelBtn=document.getElementById('cancelBtn'),downloadBtn=document.getElementById('downloadBtn');
const dbKey='sql-query-db-profile:'+{{ user_id|tojson }},sqlKey='sql-query-editor:'+{{ user_id|tojson }};let folder='',selected='',libraryData={scripts:[],folders:[]},activeRun=null,completedRun=null;
function setStatus(text,bad){status.textContent=text;status.className=bad?'error':'status'}function api(url,opt){return fetch(url,opt||{}).then(function(r){return r.json().then(function(p){if(!r.ok)throw new Error(p.error||'Request failed');return p})})}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function button(label,cls,click,title){const b=document.createElement('button');b.textContent=label;b.className=cls;b.title=title||label;b.addEventListener('click',click);return b}function folderButton(path){const label=path?'📁 '+path:'📁 Root';return button(label,'folder'+(path===folder?' active':''),function(){folder=path;selected='';renderLibrary()},label)}function renderLibrary(){library.innerHTML='';const folders=[''].concat(libraryData.folders);library.appendChild(folderButton(''));if(folder)library.appendChild(folderButton(folder));libraryData.scripts.filter(function(s){return s.folder===folder}).forEach(function(s){const label='📄 '+s.name;const b=button(label,'script'+(s.path===selected?' active':''),function(){api('/api/sql-query/scripts/'+encodeURIComponent(s.path)).then(function(p){editor.setValue(p.sql);nameInput.value=p.name.split('/').pop();selected=p.path||s.path;renderLibrary();setStatus('Script opened')}).catch(function(e){setStatus(e.message,true)})},s.path);library.appendChild(b)});folders.slice(1).filter(function(path){return path!==folder}).forEach(function(path){library.appendChild(folderButton(path))})}
function reload(){return api('/api/sql-query/scripts').then(function(p){libraryData=p;if(folder&&p.folders.indexOf(folder)<0)folder='';renderLibrary()})}function scriptPath(){return folder?folder+'/'+nameInput.value.trim():nameInput.value.trim()}
document.getElementById('saveBtn').addEventListener('click',function(){let body={name:scriptPath(),sql:editor.getValue(),overwrite:false};api('/api/sql-query/scripts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(p){if(p.requires_overwrite){if(!confirm(p.name+' already exists. Overwrite it?'))return;body.overwrite=true;return api('/api/sql-query/scripts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}return p}).then(function(p){if(!p)return;nameInput.value=p.name.split('/').pop();selected=p.name;return reload().then(function(){setStatus('Script saved')})}).catch(function(e){setStatus(e.message,true)})});
document.getElementById('uploadBtn').addEventListener('click',function(){const files=Array.from(document.getElementById('uploadInput').files);if(!files.length)return setStatus('Please select .sql file(s)',true);const data=new FormData();files.forEach(function(file){data.append('files',file)});api('/api/sql-query/scripts/upload',{method:'POST',body:data}).then(function(p){let imported=0,skipped=0;return Promise.all(p.scripts.map(function(script){const path=folder?folder+'/'+script.name:script.name;return api('/api/sql-query/scripts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:path,sql:script.sql,overwrite:false})}).then(function(result){if(result.requires_overwrite)skipped++;else imported++;return script})})).then(function(scripts){if(scripts.length){editor.setValue(scripts[0].sql);nameInput.value=scripts[0].name;selected=''}return reload().then(function(){setStatus('Imported '+imported+' script(s)'+(skipped?' ('+skipped+' duplicate(s) skipped)':''))})})}).catch(function(e){setStatus(e.message,true)})});
document.getElementById('newFolderBtn').addEventListener('click',function(){const value=prompt('New folder path (example: reports/2026):');if(value===null)return;api('/api/sql-query/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:folder?folder+'/'+value:value})}).then(function(p){folder=p.path;return reload()}).then(function(){setStatus('Folder created')}).catch(function(e){setStatus(e.message,true)})});
document.getElementById('deleteFolderBtn').addEventListener('click',function(){if(!folder)return setStatus('Select a folder to delete',true);if(!confirm('Delete empty folder '+folder+'?'))return;api('/api/sql-query/folders/'+encodeURIComponent(folder),{method:'DELETE'}).then(function(){folder='';return reload()}).then(function(){setStatus('Folder deleted')}).catch(function(e){setStatus(e.message,true)})});
document.getElementById('deleteScriptBtn').addEventListener('click',function(){if(!selected)return setStatus('Select a script to delete',true);if(!confirm('Delete '+selected+'?'))return;api('/api/sql-query/scripts/'+encodeURIComponent(selected),{method:'DELETE'}).then(function(){selected='';return reload()}).then(function(){setStatus('Script deleted')}).catch(function(e){setStatus(e.message,true)})});
function showResult(r){const panel=document.getElementById('resultPanel'),meta=document.getElementById('resultMeta'),head=document.getElementById('resultHead'),rows=document.getElementById('resultRows');panel.classList.remove('hidden');if(r.result_type==='write'){meta.textContent='Write completed: '+r.affected_rows+' row(s) affected';head.innerHTML='';rows.innerHTML='';downloadBtn.disabled=true;return}meta.textContent=r.row_count+' row(s) returned'+(r.truncated?' — showing first 1,000 rows':'');head.innerHTML=r.columns.map(function(c){return '<th>'+esc(c)+'</th>'}).join('');rows.innerHTML=r.rows.map(function(row){return '<tr>'+r.columns.map(function(c){return '<td>'+esc(row[c])+'</td>'}).join('')+'</tr>'}).join('');downloadBtn.disabled=false}
function poll(){api('/api/sql-query/runs/'+activeRun).then(function(r){if(['completed','failed','cancelled'].indexOf(r.status)>=0){activeRun=null;runBtn.disabled=false;cancelBtn.disabled=true;if(r.status==='completed'){completedRun=r.run_id;showResult(r.result||{});setStatus('Completed')}else setStatus(r.error||r.message,true)}else{setStatus(r.message||'Running SQL…');setTimeout(poll,700)}}).catch(function(e){runBtn.disabled=false;cancelBtn.disabled=true;setStatus(e.message,true)})}
runBtn.addEventListener('click',function(){const sql=editor.getValue();if(!sql.trim())return setStatus('SQL cannot be empty',true);runBtn.disabled=true;cancelBtn.disabled=false;api('/api/sql-query/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({db_profile:db.value,sql:sql})}).then(function(p){activeRun=p.run_id;poll()}).catch(function(e){runBtn.disabled=false;cancelBtn.disabled=true;setStatus(e.message,true)})});cancelBtn.addEventListener('click',function(){if(activeRun)api('/api/sql-query/runs/'+activeRun+'/cancel',{method:'POST'}).then(function(r){setStatus(r.message||'Termination requested')}).catch(function(e){setStatus(e.message,true)})});document.getElementById('clearBtn').addEventListener('click',function(){editor.setValue('');localStorage.removeItem(sqlKey);setStatus('Ready')});downloadBtn.addEventListener('click',function(){if(completedRun)window.location='/download/'+encodeURIComponent(completedRun)+'/sql_query_'+encodeURIComponent(completedRun)+'.xlsx'});
const savedDb=localStorage.getItem(dbKey);if(savedDb&&Array.from(db.options).some(function(o){return o.value===savedDb}))db.value=savedDb;db.addEventListener('change',function(){localStorage.setItem(dbKey,db.value)});const savedSql=localStorage.getItem(sqlKey);if(savedSql)editor.setValue(savedSql);editor.onChange(function(sql){localStorage.setItem(sqlKey,sql)});reload().catch(function(e){setStatus(e.message,true)});
</script></body></html>
